baseURL = 'https://obrienmustsuffer.com/'
locale = 'en-us'
title = "O'Brien Must Suffer!"
theme = 'paper'
disableKinds = ['taxonomy', 'term', 'section']

[permalinks]
  comic = '/:slug/'

